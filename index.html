<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ranking Padel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>RANKING PADEL</h1>

    <!-- NAV -->
    <div class="tabs">
        <button onclick="mostrarTab('jugadores')">Jugadores</button>
        <button onclick="mostrarTab('jornada')">Jornada</button>
        <button onclick="mostrarTab('partidos')">Partidos</button>
        <button onclick="mostrarTab('resultados')">Resultados</button>
        <button onclick="mostrarTab('clasificacion')">Clasificación</button>
        <button onclick="mostrarTab('doblajes')">Doblajes</button>
    </div>

    <!-- JUGADORES -->
    <div id="jugadores" class="tab active">
        <h2>Jugadores por grupo</h2>

        <h3>Grupo 1</h3>
        <textarea id="jugadores-g1" rows="6"></textarea>
        <button onclick="guardarJugadores('g1')">Guardar G1</button>

        <h3>Grupo 2</h3>
        <textarea id="jugadores-g2" rows="6"></textarea>
        <button onclick="guardarJugadores('g2')">Guardar G2</button>

        <h3>Grupo 3</h3>
        <textarea id="jugadores-g3" rows="6"></textarea>
        <button onclick="guardarJugadores('g3')">Guardar G3</button>
    </div>

    <!-- JORNADA -->
    <div id="jornada" class="tab">
        <h2>Seleccionar jugadores para la jornada</h2>

        <label>Fecha de la jornada:</label>
        <input type="date" id="fecha-jornada">

        <h3>Selecciona jugadores</h3>
        <div id="seleccion-jugadores"></div>

        <button id="btn-generar-partido">Generar partido</button>
    </div>

    <!-- PARTIDOS -->
    <div id="partidos" class="tab">
        <h2>Partidos generados</h2>
        <div id="partidos-contenido"></div>
    </div>

    <!-- RESULTADOS -->
    <div id="resultados" class="tab">
        <h2>Resultados</h2>
        <div id="resultados-contenido"></div>
        <button onclick="guardarResultados()">Guardar resultados</button>
    </div>

    <!-- CLASIFICACIÓN -->
    <div id="clasificacion" class="tab">
        <h2>Clasificación</h2>
        <div id="clasificacion-contenido"></div>
    </div>

    <!-- DOBLAJES -->
    <div id="doblajes" class="tab">
        <h2>Listado de Doblajes</h2>
        <div id="doblajes-contenido"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
